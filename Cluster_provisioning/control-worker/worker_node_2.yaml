swapoff -a
systemctl disable firewalld apparmor
systemctl stop firewalld apparmor
sudo ufw status

curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE="agent" sh -

mkdir -p /etc/rancher/rke2
cd /etc/rancher/rke2/

vi config.yaml



