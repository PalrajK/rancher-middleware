swapoff -a
systemctl disable firewalld apparmor
systemctl stop firewalld apparmor
sudo ufw status
curl -sfL https://get.rke2.io | sh -     
mkdir -p /etc/rancher/rke2


vi config.yaml

# Cluster bootstrap token (same across all nodes)
token: "my-shared-secret-12345"

# Load balancer endpoint for HA control plane access
tls-san:
  - rke2-nlb-88914a42d48644c0.elb.us-east-1.amazonaws.com
  - ip-10-0-0-205.ec2.internal
  - ip-10-0-1-225.ec2.internal
  - ip-10-0-2-121.ec2.internal



# Node identity
node-name: "ip-10-0-0-205"

# CNI plugin (Canal is default and stable)
cni: canal

# Logging
write-kubeconfig-mode: "0644" 


systemctl enable rke2-server.service
systemctl start rke2-server.service
systemctl status rke2-server.service
journalctl -u rke2-server.service

cat /var/lib/rancher/rke2/server/node-token > token used for other control nodes and worker nodes
