## First Time Login

If you provided your own bootstrap password during installation, browse to https://rke2-nlb-88914a42d48644c0.elb.us-east-1.amazonaws.com to get started.
If this is the first time you installed Rancher, get started by running this command and clicking the URL it generates:

```
echo https://rke2-nlb-88914a42d48644c0.elb.us-east-1.amazonaws.com/dashboard/?setup=$(kubectl get secret --namespace cattle-system bootstrap-secret -o go-template='{{.data.bootstrapPassword|base64decode}}')
```

To get just the bootstrap password on its own, run:

```
kubectl get secret --namespace cattle-system bootstrap-secret -o go-template='{{.data.bootstrapPassword|base64decode}}{{ "\n" }}'
```


