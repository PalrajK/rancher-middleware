METRIC API SERVER PORT ISSUE


The APIService v1beta1.metrics.k8s.io proxies requests to the Metrics Server using HTTPS on port 443 (or 4443 in some setups). But your pod is exposing:

--secure-port=10250

containerPort: 10250

This mismatch causes the aggregator to fail with 502 Bad Gateway when trying to reach the Metrics Server.

You need to change the Metrics Server to use port 443 or 4443, which aligns with the APIService expectations.

Permanent Fix == /var/lib/rancher/rke2/server/manifests/rke2-metrics-server.yaml --> change port from 10250 to 443/4443


/var/lib/rancher/rke2/server/token

----------------------------------------------

sudo snap install helm --classic

helm repo add rancher-latest https://releases.rancher.com/server-charts/latest
helm repo update

kubectl create namespace cattle-system

kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml

kubectl get pods -n cert-manager


